<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桶地下解読ツール</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>桶地下解読ツール</h1>
    <p>篇と旁を組み合わせて、未解読文字を登録・解読します。</p>
  </header>

  <main>

    <!-- =========================
         ① 篇を選ぶ
    ========================== -->
    <section class="card">
      <h2>① 篇を選ぶ</h2>

      <p class="help">
        下の画像から、使いたい「篇」をクリックしてください。
      </p>

      <div id="henGrid" class="image-grid"></div>

      <p id="selectedHenText" class="selected-text">
        篇：未選択
      </p>
    </section>


    <!-- =========================
         ② 旁を選ぶ
    ========================== -->
    <section class="card">
      <h2>② 旁を選ぶ</h2>

      <p class="help">
        下の画像から、使いたい「旁」をクリックしてください。
      </p>

      <div id="bouGrid" class="image-grid"></div>

      <p id="selectedBouText" class="selected-text">
        旁：未選択
      </p>
    </section>


    <!-- =========================
         ③ 組み合わせ
    ========================== -->
    <section class="card">
      <h2>③ 篇＋旁を確認</h2>

      <div id="pairPreview" class="pair-preview">
        <p>まだ選択されていません。</p>
      </div>
    </section>


    <!-- =========================
         ④ 登録
    ========================== -->
    <section class="card">
      <h2>④ 日本語を登録</h2>

      <p class="help">
        この「篇＋旁」が表す日本語を1文字だけ入力してください。
      </p>

      <input
        type="text"
        id="translationInput"
        maxlength="2"
        placeholder="例：あ"
      >

      <button id="registerButton" class="main-button">
        この文字を登録
      </button>

      <p id="registerMessage" class="message"></p>
    </section>


    <!-- =========================
         ⑤ 検索
    ========================== -->
    <section class="card">
      <h2>⑤ 登録済みの文字を確認</h2>

      <button id="searchButton" class="sub-button">
        この組み合わせを検索
      </button>

      <p id="searchResult" class="search-result"></p>
    </section>


    <!-- =========================
         ⑥ 文章を作る
    ========================== -->
    <section class="card">
      <h2>⑥ 文章を作る</h2>

      <p class="help">
        篇＋旁を選んで「文章に追加」を押すと、順番に文章を作れます。
      </p>

      <button id="addToSentenceButton" class="main-button">
        現在の文字を文章に追加
      </button>

      <button id="addSpaceButton" class="sub-button">
        スペースを追加
      </button>

      <button id="clearSentenceButton" class="danger-button">
        文章をクリア
      </button>

      <div id="sentenceArea" class="sentence-area">
        まだ文字がありません。
      </div>

      <div id="sentenceJapanese" class="japanese-result">
        解読結果：—
      </div>
    </section>


    <!-- =========================
         ⑦ 登録済み一覧
    ========================== -->
    <section class="card">
      <h2>⑦ 登録済みの対応表</h2>

      <div id="dictionaryList">
        まだ登録されていません。
      </div>
    </section>

  </main>

  <footer>
    <p>おけてちか解読ツール</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
